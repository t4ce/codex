# Local search and agent memory supplied by the Codex Blueprint bundle.
# Keep tool discovery lightweight; start the local engine on its first tool call.
[mcp_servers.xerj]
command = "xerj"
args = ["mcp", "--lazy-local"]
startup_timeout_sec = 120
# Allow the first call to wait for local readiness and then execute its request.
tool_timeout_sec = 150
required = false

[mcp_servers.xerj.env]
XERJ_URL = "http://127.0.0.1:9200"
XERJ_DISABLE_FEEDBACK = "true"

# Robotics MCP Blueprint skeleton. Opt in per session or in user config.
[mcp_servers.robomcp]
command = "robomcp"
enabled = false
required = false
