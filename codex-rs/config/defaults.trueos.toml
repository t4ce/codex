# Request the public summaries used by native read-aloud when the model supports them.
model_reasoning_summary = "concise"

# Common is TRUEOS's public FFA output directory. Let ordinary workspace-write
# sessions export there; TRUEOSFS still enforces access keys and assigns the
# destination folder's key to newly created files.
[sandbox_workspace_write]
writable_roots = ["/apps/common"]

# Native speech is part of the standard TRUEOS Blueprint launch.
[tui]
trueos_tts = true

# Optional local search and memory are disabled in the standard TRUEOS build.
# An explicit config override can opt in; the engine remains lazy.
[mcp_servers.xerj]
command = "xerj"
enabled = false
args = ["mcp", "--lazy-local"]
startup_timeout_sec = 120
# Allow the first call to wait for local readiness and then execute its request.
tool_timeout_sec = 150
required = false

[mcp_servers.xerj.env]
XERJ_URL = "http://127.0.0.1:9200"
XERJ_DISABLE_FEEDBACK = "true"

# Robotics MCP Blueprint skeleton. Opt in per session or in user config.
[mcp_servers.robomcp]
command = "robomcp"
enabled = false
required = false
