[package]
name = "codex-realtime-webrtc"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
default = []
voice = [
    "dep:codex-build-info",
    "dep:codex-install-context",
    "dep:codex-utils-pty",
    "dep:futures",
    "dep:tokio",
    "dep:tracing",
]

[dependencies]
codex-build-info = { workspace = true, optional = true }
anyhow = { workspace = true }
codex-install-context = { workspace = true, optional = true }
codex-utils-pty = { workspace = true, optional = true }
futures = { workspace = true, features = ["std"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
codex-utils-cargo-bin = { workspace = true }
ctor = { workspace = true }
pretty_assertions = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
