name: CI

on: [push, pull_request]

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - run: cargo clippy --all --tests --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rust:
          - stable

    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install dependencies
        run: sudo apt-get install libssl-dev

      - name: Install cargo-hack
        uses: taiki-e/install-action@ad35a00654e9ebc3c6918a1d412cc6df4f1ba1fa # cargo-hack

      - name: Check
        run: cargo hack check --feature-powerset --all-targets

      - name: Test
        run: cargo test --release

  test-msvr:
    name: Test MSRV
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rust:
          - 1.95.0

    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install dependencies
        run: sudo apt-get install libssl-dev

      - name: Check deflate feature
        run: cargo check --features deflate

  autobahn:
    name: Autobahn tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly

    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Running Autobahn TestSuite for client
        run: ./scripts/autobahn-client.sh

      - name: Running Autobahn TestSuite for server
        run: ./scripts/autobahn-server.sh
